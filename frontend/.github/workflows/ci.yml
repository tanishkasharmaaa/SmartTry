name: Smarttry-ci-pipline

on:
   push:
    branches:
      - main
jobs:
    tests:
        runs-on: ubuntu-latest
    
        steps:
            - name:  Checkout code
              uses: actions/checkout@v2

            - name: Setup Nodejs
              uses: actions/setup-node@v2
              with:
                node-version: '24' 
            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint 
              
            - name: Run build
              run: npm run build  
