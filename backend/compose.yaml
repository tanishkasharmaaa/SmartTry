services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    networks:
      - smarttry-network
    volumes:
      - mongodb_data:/data/db 
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s  

  backend:
    build: .
    container_name: docker_smarttry
    networks:
      - smarttry-network
    env_file:
      - .env
    ports:
        - "5000:3000"    
    depends_on: 
       mongodb:
              condition: service_healthy
volumes:
    mongodb_data:

networks:
  smarttry-network:
    driver: bridge       

