 name: Smarttry-backed-pipline
 on:
    push:
        branches:
            - main
            - master

 jobs:
    tests:
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Setup Nodejs
              uses: actions/setup-node@v2
              with: 
                node-version: '24'
            
            - name: Install dependencies
              run: npm ci
              
            - name: Start backend server
              run: npm run start:dev &  